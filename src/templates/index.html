<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/privacy_guard.js" defer></script>
    <script src="/static/app.js" defer></script>

  <body>

      <div class="header-inner">
        <a class="brand" href="/" aria-label="SBI Mutual Fund FAQ Assistant home">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9y8Y7g3hpRyKDxRWWyz--1ap3ZCmxIa7XVl2M_1yKMvECZHuCQ9J8lbFS_wzXhnUlglZvCdUqBCoYZ_xdy9apLFlOmfnMVd0Vs_zaTougwJviJoKeZqBR4ddmHvomTXDowQAQaeZgTDYtM1qltK3kDWGLa716My6XMbCsTiCd8PiTSlUnx5Lyu4swplGLcuO42laFxkJUU5dNY6qJ4CqYrCcRVjqAOYsr6M8BmsN7HBEIcb1inhee" alt="" class="brand-logo">

          <span class="brand-copy"><span class="brand-name">SBI Mutual Fund</span><span class="brand-subtitle">FAQ Assistant</span></span>

            <button class="nav-link is-current" type="button" aria-current="page" data-nav-view="assistant">Assistant</button>
            <button class="nav-link" type="button" data-nav-view="schemes">Schemes</button>
            <button class="nav-link" type="button" data-nav-view="help">Help</button>
            <button class="nav-link" type="button" data-nav-view="about">About</button>
          </nav>
          <span class="header-divider" aria-hidden="true"></span>
          <button class="profile-button" type="button" aria-label="Profile, unavailable" aria-disabled="true" data-disabled-action>
            <span class="material-symbols-outlined" data-fallback="♙" aria-hidden="true">person</span>
          </button>
        </div>
      </div>
    </header>

    <main id="assistant-app" class="app-main" aria-live="off" data-investor-url="{{ investor_portal_url }}" data-groww-url="{{ groww_dashboard_url }}"></main>
    <div id="interaction-status" class="sr-only" role="status" aria-live="polite"></div>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>Mutual Fund investments are subject to market risks. Read all scheme-related documents carefully.</span>
        <span>Informational scheme FAQs · No account access</span>
      </div>
    </footer>
